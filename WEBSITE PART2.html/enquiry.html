<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | The Daily Loaf Bakery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #4A3728;
            background-color: #FDF5E6;
        }
        header {
            background-color: #E76F51;
            padding: 1rem;
            text-align: center;
        }
        header h1 {
            color: white;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 0.75rem;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            text-align: center;
        }
        h2 {
            margin-bottom: 1rem;
            color: #E76F51;
            font-family: Georgia, serif;
        }
        form {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            margin: 2rem auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: left;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.25rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        .button {
            display: inline-block;
            background-color: #E76F51;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1.5rem;
            width: 100%;
        }
        .button:hover {
            background-color: #d35f3f;
        }
        footer {
            background-color: #4A3728;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.2rem;
            }
            nav a {
                margin: 0 0.4rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>The Daily Loaf Bakery</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Pre-Order Enquiry</h2>
        <p>Use this form to enquire about custom cake orders or large bread orders. We will get back to you within 24 hours.</p>

        <form action="#" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <label for="order-type">Order Type:</label>
            <select id="order-type" name="order-type">
                <option value="cake">Custom Celebration Cake</option>
                <option value="large-bread">Large Bread Order (10+ loaves)</option>
                <option value="pastry">Pastry Party Box</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Your Enquiry:</label>
            <textarea id="message" name="message" rows="5" placeholder="Please provide details about your order..." required></textarea>

            <label for="date">Preferred Pickup Date:</label>
            <input type="date" id="date" name="date">

            <button type="submit" class="button">Send Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 The Daily Loaf Bakery. All rights reserved.</p>
        <p>Greg Omorefe | Student: 10538053 | Group 4</p>
    </footer>

</body>
</html>
